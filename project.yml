name: LitKitchen

options:
  bundleIdPrefix: com.litkitchen
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

# Both are gitignored. Copy the .example files alongside them before the first
# build, or SUPABASE_URL resolves empty and the app quietly falls back to its
# in-memory doubles — a convincing demo that talks to nothing.
#
# Split per configuration so the two environments cannot be confused. Debug —
# anything installed from Xcode — points at staging. Release, which is what an
# archive and therefore TestFlight carries, points at production. They were one
# file until testers were on the horizon, which meant there was no way to ship a
# build that did not read and write the same database QA had been churning.
configFiles:
  Debug: Config/Secrets.Debug.xcconfig
  Release: Config/Secrets.Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 strict concurrency from day one — IMPLEMENTATION_PLAN.md §1.
    # Cheap now, a migration later.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Team HCEA5N57HT, from the Apple Development certificate on this machine
    # (OU=HCEA5N57HT, O=Rolando Navarrete). A paid membership — the profiles
    # carry a wildcard App ID and year-long expiries, neither of which a free
    # personal team gets. That is what makes the push entitlement below
    # possible at all.
    DEVELOPMENT_TEAM: HCEA5N57HT
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

    # Version, in one place. XcodeGen otherwise defaults these to a literal
    # "1.0"/"1" in each generated Info.plist, which is fine until the second
    # TestFlight upload — App Store Connect rejects a build number it has
    # already seen, and there is nowhere obvious to bump it.
    #
    # The app and the widget extension MUST carry identical values or the
    # upload is rejected outright ("the value of CFBundleVersion in your app
    # extension must match"), so both read these.
    #
    # MARKETING_VERSION is what testers see. CURRENT_PROJECT_VERSION is the
    # build counter: bump it for every upload, reset it never.
    # 1.0 to match the version record created in App Store Connect. A build
    # whose CFBundleShortVersionString differs from the App Store version is
    # accepted by TestFlight but rejected at App Store submission, so the two
    # are kept equal rather than reconciled later under time pressure.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"

targets:
  LitKitchen:
    type: application
    platform: iOS
    sources:
      - path: Sources/LitKitchen
      - path: Sources/Shared
    dependencies:
      - target: LitKitchenWidgets
        embed: true
      - package: Supabase
        product: Supabase
    info:
      path: Sources/LitKitchen/Info.plist
      properties:
        CFBundleDisplayName: Chef Next Door
        # Both read the settings above, so a release is one edit in one place
        # and the extension can never drift out of step with the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Injected from Config/Secrets.xcconfig at build time so no key is
        # ever committed in source.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Required for ActivityKit. Without it Live Activities silently fail
        # to start — no error, no activity.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # The Live Activity's buttons have always linked to litkitchen://thread/<id>,
        # but the scheme was never registered — so iOS had nothing to route the
        # URL to and simply foregrounded the app on whatever screen it left off.
        # The card looked like it worked and went nowhere.
        CFBundleURLTypes:
          - CFBundleURLName: com.litkitchen.app
            CFBundleURLSchemes:
              - litkitchen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Copy is cook-facing and explains the *why*, not just the ask.
        NSLocationWhenInUseUsageDescription: >-
          Chef Next Door uses your location to show which kitchens near you are
          cooking right now. Cooks' exact addresses are never shown on the map.
        NSCameraUsageDescription: >-
          Take photos of your food for your menu.
        NSPhotoLibraryUsageDescription: >-
          Choose photos of your food for your menu.
        ITSAppUsesNonExemptEncryption: false
    # XcodeGen GENERATES this file from `properties` — it does not reference a
    # hand-written one. Declaring only `path` silently rewrites the file as an
    # empty <dict/> on every `xcodegen generate`, which is a build that
    # succeeds and produces a binary with no entitlements at all. Keys belong
    # here, not in the .entitlements file.
    entitlements:
      path: Sources/LitKitchen/LitKitchen.entitlements
      properties:
        # ActivityKit push. Without it Activity.request(pushType: .token)
        # fails with SessionCore.PermissionsError Code=3 and no activity
        # appears — SPIKE_LIVE_ACTIVITY.md Finding 1.
        #
        # Per-configuration, because the two APNs environments do not accept
        # each other's tokens. This was hardcoded to `development`, which is
        # the sandbox — and TestFlight and App Store builds always talk to
        # *production*. A tester's build would have registered a sandbox token,
        # production APNs would have rejected every push against it, and
        # nothing would have surfaced: no error, no crash, just an app that
        # quietly never tells you a kitchen lit up. For an app whose whole
        # premise is "right now", that is the feature failing invisibly.
        #
        # Xcode expands build settings in entitlements files, the same
        # substitution `SUPABASE_URL` above relies on. See APS_ENVIRONMENT
        # in this target's settings.
        aps-environment: $(APS_ENVIRONMENT)
        # Sign in with Apple. "Default" is the plain first-party flow; the
        # other value is only for apps signing in via a related web domain.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litkitchen.app
        TARGETED_DEVICE_FAMILY: "1"
        # Without this the catalog is compiled but nothing points at the icon
        # set, and the build silently ships a blank icon — which is what was
        # happening, because there was no catalog at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sandbox for anything installed from Xcode.
        APS_ENVIRONMENT: development
      configs:
        # Archives — which is what TestFlight and the App Store get.
        Release:
          APS_ENVIRONMENT: production

  LitKitchenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/LitKitchenWidgets
      - path: Sources/Shared
    info:
      path: Sources/LitKitchenWidgets/Info.plist
      properties:
        CFBundleDisplayName: Chef Next Door
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litkitchen.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  LitKitchenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LitKitchenTests
    dependencies:
      - target: LitKitchen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litkitchen.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LitKitchen:
    build:
      targets:
        LitKitchen: all
    test:
      targets:
        - LitKitchenTests
      gatherCoverageData: true
    run:
      config: Debug
